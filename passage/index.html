<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Passage</title>
<style>:root{--bg:#05070a;--ink:#e8edf2;--dim:#8d9aa8;--line:rgba(190,210,230,.16);--panel:rgba(10,14,19,.78);--host:#2a78c2;--trav:#f0a61c;--warn:#cc3305;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,Roboto,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased}
canvas#c{position:fixed;inset:0;display:block;touch-action:none;outline:none}
.hidden{display:none!important}
button{font:inherit;color:inherit;background:none;border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer;white-space:nowrap;-webkit-tap-highlight-color:transparent;touch-action:manipulation;user-select:none;-webkit-user-select:none}
button:hover:not(:disabled){border-color:rgba(190,210,230,.4);background:rgba(190,210,230,.06)}
button:disabled{opacity:.35;cursor:default}
button:focus-visible{outline:2px solid #9fd0ff;outline-offset:2px}
button.on{background:rgba(159,208,255,.16);border-color:rgba(159,208,255,.6)}
.vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 45%,rgba(0,0,0,.6) 100%)}
/* audio */
#audio{position:fixed;top:10px;right:12px;z-index:30;display:flex;gap:6px}
#audio button{font-size:12px;padding:5px 9px;color:var(--dim);background:var(--panel)}
#audio button.off{text-decoration:line-through;opacity:.7}
/* screens */
.screen{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;overflow:auto}
#title{justify-content:flex-end;padding:0 20px 9vh;text-align:center;background:linear-gradient(to top,rgba(5,7,10,.92) 0%,rgba(5,7,10,.5) 38%,transparent 62%)}
#title h1{font-family:var(--serif);font-weight:400;font-size:clamp(52px,11vw,120px);letter-spacing:.2em;margin:0 0 0 .2em;line-height:1}
#title p{font-family:var(--serif);font-style:italic;color:var(--dim);font-size:clamp(15px,2.2vw,20px);margin:14px 0 28px}
.menu{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.menu button{padding:12px 22px;font-size:16px;background:var(--panel)}
.primary{background:rgba(240,166,28,.16)!important;border-color:rgba(240,166,28,.7)!important}
#select{background:rgba(5,7,10,.93);align-items:stretch;padding:18px clamp(14px,4vw,56px) 60px}
.selTop{display:flex;align-items:center;gap:14px;margin:36px 0 8px}
.selTop h2{font-family:var(--serif);font-weight:400;font-size:30px;letter-spacing:.08em;margin:0}
.room{border-top:1px solid var(--line);padding:16px 0 6px}
.roomHead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.rn{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.rt{font-family:var(--serif);font-size:21px}
.lock{font-size:12px;color:var(--dim);font-style:italic}
.link{border:none;padding:2px 4px;color:#9fd0ff;font-size:12px;text-decoration:underline}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px}
.tile{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 8px 10px;background:rgba(190,210,230,.03);text-align:center;white-space:normal;min-height:150px}
.tile svg{width:64px;height:64px;color:#b9cbe0;margin-bottom:4px}
.tile .tn{font-size:13px;line-height:1.25;overflow-wrap:anywhere;hyphens:auto;max-width:100%}
.tile .tt{font-size:13px;color:var(--trav);letter-spacing:.08em;margin-top:auto}
.tile .ts{font-size:11px;color:var(--dim)}
.tile.special .tt{color:#e9b9a6;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase}
.tile.locked{opacity:.3}
.room.closed .rt{color:var(--dim)}
.rand{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:14px 0 4px;font-size:14px;color:var(--dim)}
.rand input{accent-color:var(--trav)}
#note{justify-content:center;background:rgba(5,7,10,.9);padding:24px;text-align:center}
#note .box{max-width:560px}
#noteNum{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}
#noteTitle{font-family:var(--serif);font-weight:400;font-size:clamp(30px,5vw,44px);margin:10px 0 18px}
#noteText{font-family:var(--serif);font-size:clamp(17px,2.3vw,20px);line-height:1.6;color:#cfd8e1;margin:0 0 30px}
/* play */
#hud{position:fixed;inset:0;z-index:10;pointer-events:none}
#hud>*{pointer-events:auto}
#hud.dim .bottom,#hud.dim #prompt{opacity:0;pointer-events:none}
.top{position:absolute;top:0;left:0;right:0;display:flex;align-items:flex-start;gap:12px;padding:10px 12px;background:linear-gradient(rgba(5,7,10,.85),transparent);pointer-events:none!important}
.top>*{pointer-events:auto}
#bBack{background:var(--panel);font-size:13px}
.ttl{flex:1;min-width:0}
#lvChapter{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
#lvName{font-family:var(--serif);font-size:clamp(19px,3vw,26px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.score{text-align:right;margin-right:172px;max-width:46vw}
#stars{color:var(--trav);font-size:19px;letter-spacing:.14em;min-height:22px}
#scoreLine{font-size:12.5px;color:#b8c4d0}
#scoreLine.flag{color:#f0c0ac;letter-spacing:.06em;font-size:11.5px}
#prompt{position:absolute;top:92px;left:50%;transform:translateX(-50%);width:min(620px,92vw);text-align:center;font-family:var(--serif);font-size:clamp(15px,2.1vw,18px);line-height:1.45;color:#dfe7ee;text-shadow:0 1px 10px #000,0 0 3px #000;opacity:0;transition:opacity .6s;pointer-events:none!important}
#prompt.show{opacity:1}
.bottom{position:absolute;left:0;right:0;bottom:0;padding:8px 10px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(5,7,10,.88) 26%);display:flex;flex-direction:column;gap:7px;transition:opacity .4s}
.statusRow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;text-align:center}
#status{font-size:13.5px;color:#f1c7b6;text-shadow:0 1px 5px #000,0 0 2px #000}
#status.ok{color:#bfe6c9}
#readout{font-size:12px;color:#aab6c2;text-shadow:0 1px 5px #000;width:100%;min-height:15px;font-variant-numeric:tabular-nums}
.legend{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;font-size:12px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:99px;font-size:12px;background:var(--panel)}
span.chip{border:1px solid var(--line);color:var(--dim)}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block}
.sw.h{background:var(--host)}.sw.t{background:var(--trav)}
.sw.o{background:repeating-linear-gradient(45deg,#cc3305 0 3px,#fff2d6 3px 6px)}
.bar{display:flex;gap:6px;align-items:center;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.bar::-webkit-scrollbar{display:none}
.bar button{font-size:13px;padding:8px 11px;background:var(--panel);flex:none}
.bar .sep{flex:none;width:1px;height:22px;background:var(--line);margin:0 2px}
.bar .grow{flex:1}
#tools{display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap;font-size:12px;color:var(--dim)}
#tools button{font-size:12px;padding:6px 10px;background:var(--panel)}
#growBox{display:flex;gap:6px;align-items:center;flex:none}
#growVal{font-size:13px;min-width:112px;text-align:center;font-variant-numeric:tabular-nums}
#bPass{flex:none;font-size:15px;padding:10px 20px;border-radius:10px;background:var(--panel)}
#bPass.lit{background:var(--trav);color:#201400;border-color:#ffd98a;font-weight:600;box-shadow:0 0 24px rgba(240,166,28,.55);animation:glow 1.6s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 38px rgba(240,166,28,.9)}}
#card{position:fixed;z-index:25;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(560px,94vw);max-height:60vh;overflow:auto;background:rgba(9,13,18,.93);border:1px solid var(--line);border-radius:14px;padding:16px 20px;text-align:center;backdrop-filter:blur(6px)}
#cardTitle{font-family:var(--serif);font-weight:400;font-size:28px;margin:0 0 6px}
#cardBody p{margin:5px 0;line-height:1.45;color:#cfd8e1;font-size:14.5px}
#cardBody .big{font-size:28px;color:var(--trav);letter-spacing:.2em;margin:4px 0 2px}
#cardBody .small{font-size:13px;color:var(--dim)}
#cardBody pre{text-align:left;font-size:10.5px;white-space:pre-wrap;word-break:break-all;background:rgba(190,210,230,.06);padding:10px;border-radius:8px;overflow:auto;color:#cfe0f0}
#card .menu{margin-top:12px}
#fatal{position:fixed;inset:0;z-index:99;display:flex;align-items:center;justify-content:center;padding:30px;text-align:center;font-family:var(--serif);font-size:19px;line-height:1.5;background:var(--bg)}
@media (max-width:640px){
  .bar{flex-wrap:wrap;justify-content:center;overflow:visible}
  .bar .sep,.bar .grow{display:none}
  .bar button{padding:7px 9px;font-size:12px}
  #bPass{order:-2;flex:1 1 100%;font-size:15px;padding:11px}
  #growBox{order:-1;flex:1 1 100%;justify-content:center}
  #tools button{padding:5px 8px}
  #audio button{font-size:11px;padding:4px 7px}
  .score{margin-right:0;margin-top:30px;max-width:44vw}
  #scoreLine{font-size:11px}
  #prompt{top:104px}
  .tile{min-height:136px}
}
@media (prefers-reduced-motion:reduce){#bPass.lit{animation:none}}
</style>
</head>
<body>
<canvas id="c" tabindex="0" aria-label="The room: two shapes over a light table"></canvas>
<div class="vignette"></div>
<div id="fatal" class="hidden">Passage could not load its 3D library.<br>Check your internet connection and open the file again.</div>

<div id="audio"><button id="bSound">Sound on</button><button id="bMusic">Music on</button></div>

<div id="title" class="screen">
  <h1>PASSAGE</h1>
  <p>A shape, its twin, and a way through.</p>
  <div class="menu"><button id="bBegin" class="primary">Begin</button><button id="bRooms">Rooms</button><button id="bFree">Free play</button></div>
</div>

<div id="select" class="screen hidden">
  <div class="selTop"><button id="selBack">‹ Title</button><h2>Rooms</h2></div>
  <div id="rooms"></div>
  <section class="room">
    <div class="roomHead" id="freeHead"><span class="rn">Free play</span><span class="rt">Every shape, and shapes nobody has seen</span></div>
    <div class="rand"><button id="bRandom" class="primary">New random shape</button><label>Corners up to <b id="randNv">12</b> <input id="randN" type="range" min="5" max="28" value="12"></label></div>
    <div class="tiles" id="freeTiles"></div>
  </section>
</div>

<div id="note" class="screen hidden"><div class="box">
  <div id="noteNum"></div><h2 id="noteTitle"></h2><p id="noteText"></p>
  <button id="noteGo" class="primary" style="padding:12px 26px;font-size:16px">Enter</button>
</div></div>

<div id="hud" class="hidden">
  <div class="top">
    <button id="bBack">‹ Rooms</button>
    <div class="ttl"><div id="lvChapter"></div><div id="lvName"></div></div>
    <div class="score"><div id="stars"></div><div id="scoreLine"></div></div>
  </div>
  <div id="prompt"></div>
  <div class="bottom">
    <div class="statusRow"><span id="status"></span><span id="readout"></span></div>
    <div class="legend">
      <button class="chip" id="chipHost" title="Arrow keys turn the host"><i class="sw h"></i>Host</button>
      <button class="chip" id="chipTrav" title="Arrow keys turn the traveller"><i class="sw t"></i>Traveller</button>
      <span class="chip"><i class="sw o"></i>Sticking out</span>
    </div>
    <div id="tools" class="hidden">Dragging will:
      <button id="t_turnHost">Turn host</button><button id="t_turnTrav">Turn traveller</button><button id="t_slide">Slide shadow</button><button id="t_spin">Spin shadow</button><button id="t_pan">Move view</button><button id="bFit">Fit view</button><button id="bTight">Go to tightest spot</button>
    </div>
    <div class="bar">
      <button id="bUndo" title="Z">Undo</button>
      <button id="bResetH">Reset host</button>
      <button id="bResetT">Reset traveller</button>
      <button id="bHint" title="H">Hint</button>
      <span class="sep"></span>
      <button id="bFine" title="F">Fine: off</button>
      <button id="bTable" title="T">Table view</button>
      <button id="bSpinL" title="Q" aria-label="Spin shadow left">⟲</button>
      <button id="bSpinR" title="E" aria-label="Spin shadow right">⟳</button>
      <span class="grow"></span>
      <div id="growBox" class="hidden"><button id="bGrowM" aria-label="Shrink traveller">−</button><span id="growVal">Size +0.00%</span><button id="bGrowP" aria-label="Grow traveller">+</button></div>
      <button id="bPass" disabled>Pass through</button>
    </div>
  </div>
</div>

<div id="card" class="hidden">
  <h2 id="cardTitle"></h2><div id="cardBody"></div>
  <div class="menu"><button id="cardSave" class="hidden">Save as file</button><button id="cardAgain">Try it bigger</button><button id="cardNext" class="primary">Next</button><button id="cardRooms">Rooms</button></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>// Passage — geometry core. Pure JS, no dependencies. Runs in the browser and in Node (tests, solver).
// Conventions: 3D points are [x,y,z] with y up. The table is the x-z plane, light comes straight down,
// so a shadow point is [u,v] = [x,z]. Quaternions are [x,y,z,w].
(function (root) {
  'use strict';

  var EPS_FIT = 1e-9;    // a shadow "fits" only if every corner is more than this far inside
  var HULL_TOL = 1e-14;

  // ---------- quaternions ----------
  function qmul(a, b) {
    return [
      a[3] * b[0] + a[0] * b[3] + a[1] * b[2] - a[2] * b[1],
      a[3] * b[1] - a[0] * b[2] + a[1] * b[3] + a[2] * b[0],
      a[3] * b[2] + a[0] * b[1] - a[1] * b[0] + a[2] * b[3],
      a[3] * b[3] - a[0] * b[0] - a[1] * b[1] - a[2] * b[2]
    ];
  }
  function qnorm(q) {
    var l = Math.hypot(q[0], q[1], q[2], q[3]) || 1;
    return [q[0] / l, q[1] / l, q[2] / l, q[3] / l];
  }
  function qaxis(ax, ay, az, ang) {
    var l = Math.hypot(ax, ay, az) || 1, s = Math.sin(ang / 2) / l;
    return [ax * s, ay * s, az * s, Math.cos(ang / 2)];
  }
  function qexp(rx, ry, rz) {
    var a = Math.hypot(rx, ry, rz);
    if (a < 1e-15) return [0, 0, 0, 1];
    var s = Math.sin(a / 2) / a;
    return [rx * s, ry * s, rz * s, Math.cos(a / 2)];
  }
  function qmat(q) {
    var x = q[0], y = q[1], z = q[2], w = q[3];
    return [
      1 - 2 * (y * y + z * z), 2 * (x * y - z * w), 2 * (x * z + y * w),
      2 * (x * y + z * w), 1 - 2 * (x * x + z * z), 2 * (y * z - x * w),
      2 * (x * z - y * w), 2 * (y * z + x * w), 1 - 2 * (x * x + y * y)
    ];
  }
  function qrot(q, v) {
    var m = qmat(q);
    return [m[0] * v[0] + m[1] * v[1] + m[2] * v[2], m[3] * v[0] + m[4] * v[1] + m[5] * v[2], m[6] * v[0] + m[7] * v[1] + m[8] * v[2]];
  }
  // rotation that takes unit vector a onto unit vector b
  function qfromTo(a, b) {
    var d = a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
    if (d < -0.999999) {
      var ax = Math.abs(a[0]) < 0.9 ? [1, 0, 0] : [0, 1, 0];
      var c0 = [a[1] * ax[2] - a[2] * ax[1], a[2] * ax[0] - a[0] * ax[2], a[0] * ax[1] - a[1] * ax[0]];
      return qaxis(c0[0], c0[1], c0[2], Math.PI);
    }
    return qnorm([a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0], 1 + d]);
  }
  function qrandom(rng) {
    var u1 = rng(), u2 = rng() * 2 * Math.PI, u3 = rng() * 2 * Math.PI;
    var a = Math.sqrt(1 - u1), b = Math.sqrt(u1);
    return [a * Math.sin(u2), a * Math.cos(u2), b * Math.sin(u3), b * Math.cos(u3)];
  }
  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      var t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // ---------- shadows ----------
  // Shadow corners of verts turned by q, scaled by s and slid by (tx,ty) on the table.
  function project(verts, q, s, tx, ty) {
    var m = qmat(q), out = new Array(verts.length);
    s = s === undefined ? 1 : s; tx = tx || 0; ty = ty || 0;
    for (var i = 0; i < verts.length; i++) {
      var v = verts[i];
      out[i] = [tx + s * (m[0] * v[0] + m[1] * v[1] + m[2] * v[2]), ty + s * (m[6] * v[0] + m[7] * v[1] + m[8] * v[2])];
    }
    return out;
  }
  function cross2(o, a, b) { return (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]); }
  // Outline of a set of points: counter-clockwise, no repeated or in-line points.
  function hull2d(P) {
    var n = P.length;
    if (n < 3) return P.slice();
    var S = P.slice().sort(function (a, b) { return a[0] - b[0] || a[1] - b[1]; });
    var H = [], i;
    for (i = 0; i < n; i++) {
      while (H.length >= 2 && cross2(H[H.length - 2], H[H.length - 1], S[i]) <= HULL_TOL) H.pop();
      H.push(S[i]);
    }
    var lo = H.length + 1;
    for (i = n - 2; i >= 0; i--) {
      while (H.length >= lo && cross2(H[H.length - 2], H[H.length - 1], S[i]) <= HULL_TOL) H.pop();
      H.push(S[i]);
    }
    H.pop();
    return H;
  }
  // Each edge of a CCW outline as an outward unit normal n and offset d: inside means n.p < d.
  function edgesOf(H) {
    var E = [];
    for (var i = 0; i < H.length; i++) {
      var a = H[i], b = H[(i + 1) % H.length];
      var ex = b[0] - a[0], ey = b[1] - a[1], l = Math.hypot(ex, ey);
      if (l < 1e-300) continue;
      var nx = ey / l, ny = -ex / l;
      E.push([nx, ny, nx * a[0] + ny * a[1]]);
    }
    return E;
  }
  // Smallest distance from any point to the outline, positive when inside. The exact fit test.
  function clearance(E, pts) {
    var best = Infinity;
    for (var j = 0; j < E.length; j++) {
      var e = E[j];
      for (var i = 0; i < pts.length; i++) {
        var s = e[2] - e[0] * pts[i][0] - e[1] * pts[i][1];
        if (s < best) best = s;
      }
    }
    return best;
  }
  function fits(E, pts) { return clearance(E, pts) > EPS_FIT; }
  // Largest factor the traveller (unit-size shadow corners Q around its own centre, centre at t)
  // can grow to before it touches the host outline. Below 1 means it sticks out as it is.
  function maxScale(E, Q, tx, ty) {
    var best = Infinity;
    for (var j = 0; j < E.length; j++) {
      var e = E[j], h = -Infinity;
      for (var i = 0; i < Q.length; i++) {
        var s = e[0] * Q[i][0] + e[1] * Q[i][1];
        if (s > h) h = s;
      }
      var r = (e[2] - e[0] * tx - e[1] * ty) / h;
      if (r < best) best = r;
    }
    return best;
  }
  function area2d(P) {
    var a = 0;
    for (var i = 0; i < P.length; i++) { var p = P[i], q = P[(i + 1) % P.length]; a += p[0] * q[1] - p[1] * q[0]; }
    return a / 2;
  }
  // Part of convex outline S that lies inside the convex outline with edges E.
  function clip2d(S, E) {
    var out = S;
    for (var j = 0; j < E.length && out.length; j++) {
      var e = E[j], inp = out; out = [];
      for (var i = 0; i < inp.length; i++) {
        var a = inp[i], b = inp[(i + 1) % inp.length];
        var sa = e[0] * a[0] + e[1] * a[1] - e[2], sb = e[0] * b[0] + e[1] * b[1] - e[2];
        if (sa <= 0) out.push(a);

    var H = canvas.clientHeight || 1, bot = S.screen === 'play' ? document.querySelector('.bottom').offsetHeight : 0, top = 64;
    var usable = Math.max(0.3, (H - bot - top) / H);
    var need = Math.max((z1 - z0) / 2 * 1.12 / usable, (x1 - x0) / 2 * 1.15 / a) / t;
    cam.tz = tableBase() / need;
    cam.cz += (2 * need * t / H) * (bot - top) / 2;
  }
  // jump the table view to the corner of the amber shadow that is closest to (or furthest past) the blue outline
  function tightSpot() {
    var ev = S.ev, best = Infinity, at = null;
    ev.trav.forEach(function (p) { var c = G.clearance(ev.edges, [p]); if (c < best) { best = c; at = p; } });
    if (!at) return;
    var t = Math.tan(camera.fov * Math.PI / 360), half = Math.min(1.2, Math.max(Math.abs(best) * 7, 0.004));
    cam.cx = at[0]; cam.cz = at[1]; cam.tz = Math.min(20000, tableBase() / (half / t));
  }
  function setTable(on) {
    if (S.table === on) return;
    S.table = on; cam.blend = 0;
    if (on && S.ev) fitTableView();
    if (S.screen === 'play') { syncHud(); refresh(); }
  }
  function resize() {
    var w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h, false); canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
    camera.aspect = w / h; camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);
  var gp = new THREE.Vector3(), gt = new THREE.Vector3();
  function updateCamera(dt) {
    var solidsOn = !S.table;
    hostGroup.visible = solidsOn && !cutGroup.visible; travGroup.visible = solidsOn; dropLines.visible = solidsOn; dust.visible = solidsOn;
    if (S.busy && cutGroup.visible) hostGroup.visible = false;
    if (S.table) {
      var h = tableBase() / cam.tz;
      gp.set(cam.cx, h, cam.cz); helper.position.copy(gp); helper.up.set(0, 0, -1); helper.lookAt(cam.cx, 0, cam.cz);
    } else {
      var vf = camera.fov * Math.PI / 360, hf = Math.atan(Math.tan(vf) * camera.aspect);
      var dist = Math.max(3.55 / Math.sin(vf), 3.3 / Math.sin(hf)) * cam.z3 * (1 + 0.22 * cam.lift);
      gt.set(0.9 * (1 - cam.lift), 2.3 + 0.9 * cam.lift, 0);
      if (S.attract) { gt.set(0.9, 1.1, 0); dist *= 1.12; }
      gp.set(gt.x + dist * Math.sin(cam.yaw) * Math.cos(cam.pitch), gt.y + dist * Math.sin(cam.pitch), gt.z + dist * Math.cos(cam.yaw) * Math.cos(cam.pitch));
      helper.position.copy(gp); helper.up.set(0, 1, 0); helper.lookAt(gt);
    }
    cam.blend = Math.min(1, cam.blend + dt * 1.6);
    var k = S.table && cam.blend >= 1 ? 1 : 1 - Math.exp(-dt * 9);
    camera.position.lerp(gp, k); camera.quaternion.slerp(helper.quaternion, k);
    if (S.table) { camera.near = Math.max(1e-5, camera.position.y * 0.02); camera.far = camera.position.y * 6 + 5; }
    else { camera.near = 0.3; camera.far = 90; }
    camera.updateProjectionMatrix(); camera.updateMatrixWorld();
  }

  // ---------- pointer, touch and keys ----------
  var ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), pointers = {}, drag = null, gest = null;
  function setRay(x, y) {
    var r = canvas.getBoundingClientRect();
    ndc.set((x - r.left) / r.width * 2 - 1, -((y - r.top) / r.height * 2 - 1)); ray.setFromCamera(ndc, camera);
  }
  function tablePoint(x, y) {
    setRay(x, y); var o = ray.ray.origin, d = ray.ray.direction;
    if (Math.abs(d.y) < 1e-12) return null;
    var t = -o.y / d.y; return t > 0 ? [o.x + d.x * t, o.z + d.z * t] : null;
  }
  function inside(P, pt, margin) { return P.length >= 3 && G.clearance(G.edgesOf(P), [pt]) > -margin; }
  function pick(x, y, button) {
    if (S.table) {
      if (button === 2 || button === 1) return { kind: 'pan' };
      return { kind: S.tool };
    }
    setRay(x, y);
    var hit = ray.intersectObjects([hostMesh, travMesh])[0];
    if (hit) return { kind: hit.object === hostMesh ? 'turnHost' : 'turnTrav' };
    var tp = tablePoint(x, y);
    if (tp) {
      if (Math.hypot(tp[0] - S.knob[0], tp[1] - S.knob[1]) < S.knob[2]) return { kind: 'spinKnob' };
      if (inside(S.ev.trav, tp, 0.1)) return { kind: 'slide' };
    }
    return { kind: 'orbit' };
  }
  function turn(who, dx, dy) {
    var e = camera.matrixWorld.elements, k = 0.0075 * FINE[S.fine];
    var dq = G.qmul(G.qaxis(e[4], e[5], e[6], dx * k), G.qaxis(e[0], e[1], e[2], dy * k));
    if (who === 'host') S.hq = G.qnorm(G.qmul(dq, S.hq)); else S.tq = G.qnorm(G.qmul(dq, S.tq));
    S.turned += Math.hypot(dx, dy) * k;
  }
  function spin(da) { S.tq = G.qnorm(G.qmul(G.qaxis(0, 1, 0, -da), S.tq)); }
  function slide(dx, dz) {
    S.tx += dx; S.tz += dz;
    var r = Math.hypot(S.tx, S.tz); if (r > 4.6) { S.tx *= 4.6 / r; S.tz *= 4.6 / r; }
  }
  canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  canvas.addEventListener('pointerdown', function (e) {
    if (S.screen !== 'play' || S.busy) return;
    FX.unlock();
    try { canvas.setPointerCapture(e.pointerId); } catch (err) { }
    pointers[e.pointerId] = { x: e.clientX, y: e.clientY };
    var ids = Object.keys(pointers);
    if (ids.length === 2) {
      var a = pointers[ids[0]], b = pointers[ids[1]];
      gest = { d: Math.hypot(a.x - b.x, a.y - b.y), a: Math.atan2(b.y - a.y, b.x - a.x), cx: (a.x + b.x) / 2, cy: (a.y + b.y) / 2, pushed: false };
      drag = null; return;
    }
    var p = pick(e.clientX, e.clientY, e.button);
    drag = { kind: p.kind, id: e.pointerId, x: e.clientX, y: e.clientY, pushed: false, tp: tablePoint(e.clientX, e.clientY) };
    if (p.kind === 'turnHost') S.sel = 'host'; if (p.kind === 'turnTrav') S.sel = 'trav';
    if (p.kind === 'spinKnob') drag.ang = Math.atan2(drag.tp[1] - S.tz, drag.tp[0] - S.tx);
    syncHud();
  });
  window.addEventListener('pointermove', function (e) {
    if (!pointers[e.pointerId]) return;
    pointers[e.pointerId] = { x: e.clientX, y: e.clientY };
    if (gest) {
      var ids = Object.keys(pointers); if (ids.length < 2) return;
      var a = pointers[ids[0]], b = pointers[ids[1]];
      var d = Math.hypot(a.x - b.x, a.y - b.y), an = Math.atan2(b.y - a.y, b.x - a.x), cx = (a.x + b.x) / 2, cy = (a.y + b.y) / 2;
      if (S.table) {
        var w = worldPerPx(); cam.cx -= (cx - gest.cx) * w; cam.cz -= (cy - gest.cy) * w;
        zoomAt(cx, cy, d / Math.max(1, gest.d));
      } else {
        cam.z3 = Math.min(1.7, Math.max(0.5, cam.z3 * gest.d / Math.max(1, d)));
        var da = an - gest.a; if (da > Math.PI) da -= 2 * Math.PI; if (da < -Math.PI) da += 2 * Math.PI;
        if (Math.abs(da) > 0) { if (!gest.pushed) { pushUndo(); gest.pushed = true; } spin(da * FINE[S.fine]); }
      }
      gest.d = d; gest.a = an; gest.cx = cx; gest.cy = cy; refresh(); return;
    }
    if (!drag || drag.id !== e.pointerId) return;
    var dx = e.clientX - drag.x, dy = e.clientY - drag.y; if (!dx && !dy) return;
    drag.x = e.clientX; drag.y = e.clientY;
    var k = drag.kind, changes = k !== 'orbit' && k !== 'pan';
    if (changes && !drag.pushed) { pushUndo(); drag.pushed = true; }
    if (k === 'turnHost') turn('host', dx, dy);
    else if (k === 'turnTrav') turn('trav', dx, dy);
    else if (k === 'slide') {
      var tp = tablePoint(e.clientX, e.clientY);
      if (tp && drag.tp) slide((tp[0] - drag.tp[0]) * FINE[S.fine], (tp[1] - drag.tp[1]) * FINE[S.fine]);
      drag.tp = tp;
    } else if (k === 'spin') spin(dx * 0.0075 * FINE[S.fine]);
    else if (k === 'spinKnob') {
      var tq = tablePoint(e.clientX, e.clientY);
      if (tq) { var an2 = Math.atan2(tq[1] - S.tz, tq[0] - S.tx), d2 = an2 - drag.ang; if (d2 > Math.PI) d2 -= 2 * Math.PI; if (d2 < -Math.PI) d2 += 2 * Math.PI; spin(d2 * FINE[S.fine]); drag.ang = an2; }
    } else if (k === 'orbit') { cam.yaw -= dx * 0.006; cam.pitch = Math.min(1.35, Math.max(0.2, cam.pitch + dy * 0.005)); }
    else if (k === 'pan') { var w2 = worldPerPx(); cam.cx -= dx * w2; cam.cz -= dy * w2; }
    refresh();
  });
  function endPointer(e) {
    delete pointers[e.pointerId];
    if (Object.keys(pointers).length < 2) gest = null;
    if (drag && drag.id === e.pointerId) drag = null;
  }
  window.addEventListener('pointerup', endPointer); window.addEventListener('pointercancel', endPointer);
  function zoomAt(x, y, f) {
    var before = tablePoint(x, y), z = Math.min(20000, Math.max(0.35, cam.tz * f));
    if (before) { var r = cam.tz / z; cam.cx = before[0] + (cam.cx - before[0]) * r; cam.cz = before[1] + (cam.cz - before[1]) * r; }
    cam.tz = z;
  }
  canvas.addEventListener('wheel', function (e) {
    if (S.screen !== 'play') return; e.preventDefault();
    var f = Math.exp(-e.deltaY * 0.0015);
    if (S.table) { zoomAt(e.clientX, e.clientY, f); updateCamera(0); refresh(); }
    else cam.z3 = Math.min(1.7, Math.max(0.5, cam.z3 / f));
  }, { passive: false });
  canvas.addEventListener('dblclick', function () { if (S.table && S.screen === 'play') { fitTableView(); refresh(); } });

  var keyUndoAt = 0;
  function keyAct(fn) { if (S.busy) return; var n = performance.now(); if (n - keyUndoAt > 700) pushUndo(); keyUndoAt = n; fn(); refresh(); }
  window.addEventListener('keydown', function (e) {
    if (e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return;
    if (S.screen === 'note' && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); return $('noteGo').click(); }
    if (S.screen === 'card' && e.key === 'Enter') { e.preventDefault(); return $('cardAgain').click(); }
    if (S.screen !== 'play') return;
    var k = e.key.length === 1 ? e.key.toLowerCase() : e.key, px = 22, sl = 0.04 * FINE[S.fine], who = S.sel;
    if ((e.ctrlKey || e.metaKey) && k === 'z') { e.preventDefault(); return undo(); }
    if (e.ctrlKey || e.metaKey) return;
    var used = true;
    if (k === 'ArrowLeft') keyAct(function () { turn(who, -px, 0); });
    else if (k === 'ArrowRight') keyAct(function () { turn(who, px, 0); });
    else if (k === 'ArrowUp') keyAct(function () { turn(who, 0, -px); });
    else if (k === 'ArrowDown') keyAct(function () { turn(who, 0, px); });
    else if (k === 'q') keyAct(function () { spin(-0.05 * FINE[S.fine]); });
    else if (k === 'e') keyAct(function () { spin(0.05 * FINE[S.fine]); });
    else if (k === 'a') keyAct(function () { slide(-sl, 0); });
    else if (k === 'd') keyAct(function () { slide(sl, 0); });
    else if (k === 'w') keyAct(function () { slide(0, -sl); });
    else if (k === 's') keyAct(function () { slide(0, sl); });
    else if (k === 'Tab') { S.sel = S.sel === 'host' ? 'trav' : 'host'; syncHud(); }
    else if (k === 'z') undo();
    else if (k === 'f') $('bFine').click();
    else if (k === 't') $('bTable').click();
    else if (k === 'h') hint();
    else if (k === '=' || k === '+') grow(1);
    else if (k === '-' || k === '_') grow(-1);
    else if (k === 'Enter' || k === ' ') doPass();
    else if (k === 'Escape') openSelect();
    else used = false;
    if (used) e.preventDefault();
  });

  function grow(dir) {
    if (S.busy || $('growBox').classList.contains('hidden')) return;
    pushUndo(); S.s = Math.max(1, Math.min(1.6, S.s + dir * GROW[S.fine]));
    if (Math.abs(S.s - 1) < 1e-12) S.s = 1; refresh();
  }
  function holdable(el, fn) {
    var t1 = null, t2 = null;
    function stop() { clearTimeout(t1); clearInterval(t2); }
    el.addEventListener('pointerdown', function (e) { e.preventDefault(); FX.unlock(); fn(); stop(); t1 = setTimeout(function () { t2 = setInterval(fn, 55); }, 380); });
    ['pointerup', 'pointerleave', 'pointercancel'].forEach(function (n) { el.addEventListener(n, stop); });
  }
  function on(id, fn) { $(id).addEventListener('click', function (e) { FX.unlock(); FX.ui(); fn(e); }); }

  on('bBegin', function () { var f = firstUnfinished(); if (f) startLevel(f); else openSelect(); });
  on('bRooms', openSelect); on('bFree', function () { openSelect(); $('freeHead').scrollIntoView(); });
  on('selBack', function () { S.attract = true; show('title'); });
  on('bBack', openSelect);
  on('noteGo', function () { var n = noteNext; noteNext = null; if (n) n(); else openSelect(); });
  on('bUndo', undo);
  on('bResetH', function () { if (S.busy) return; pushUndo(); S.hq = I4.slice(); refresh(); });
  on('bResetT', function () { if (S.busy) return; pushUndo(); S.tq = I4.slice(); S.tx = START[0]; S.tz = START[1]; refresh(); });
  on('bHint', hint);
  on('bFine', function () { S.fine = (S.fine + 1) % FINE.length; syncHud(); refresh(); });
  on('bTable', function () { if (S.busy) return; setTable(!S.table); });
  on('bFit', function () { fitTableView(); refresh(); });
  on('bTight', function () { tightSpot(); refresh(); });
  on('chipHost', function () { S.sel = 'host'; if (S.table) S.tool = 'turnHost'; syncHud(); });
  on('chipTrav', function () { S.sel = 'trav'; if (S.table) S.tool = 'turnTrav'; syncHud(); });
  ['turnHost', 'turnTrav', 'slide', 'spin', 'pan'].forEach(function (t) {
    on('t_' + t, function () { S.tool = t; if (t === 'turnHost') S.sel = 'host'; if (t === 'turnTrav') S.sel = 'trav'; syncHud(); });
  });
  holdable($('bSpinL'), function () { keyAct(function () { spin(-0.05 * FINE[S.fine]); }); });
  holdable($('bSpinR'), function () { keyAct(function () { spin(0.05 * FINE[S.fine]); }); });
  holdable($('bGrowM'), function () { grow(-1); });
  holdable($('bGrowP'), function () { grow(1); });
  on('bPass', doPass);
  on('cardAgain', afterPass);
  on('cardNext', function () { afterPass(); nextLevel(); });
  on('cardRooms', function () { afterPass(); openSelect(); });
  on('cardSave', saveFile);
  on('bRandom', function () {
    var n = +$('randN').value, seed = Math.floor(Math.random() * 90000) + 10000;
    S.randBest = 0; startLevel('random:' + seed + ':' + n, true);
  });
  $('randN').addEventListener('input', function () { $('randNv').textContent = $('randN').value; });
  function syncAudio() {
    $('bSound').textContent = save.sound ? 'Sound on' : 'Sound off'; $('bMusic').textContent = save.music ? 'Music on' : 'Music off';
    $('bSound').classList.toggle('off', !save.sound); $('bMusic').classList.toggle('off', !save.music);
    FX.setSound(save.sound); FX.setMusic(save.music);
  }
  $('bSound').addEventListener('click', function () { save.sound = !save.sound; persist(); FX.unlock(); syncAudio(); });
  $('bMusic').addEventListener('click', function () { save.music = !save.music; persist(); FX.unlock(); syncAudio(); });
  FX.state.sound = save.sound; FX.state.music = save.music; syncAudio();
  document.addEventListener('pointerdown', function () { FX.unlock(); }, { once: true });

  // ---------- frame loop ----------
  var last = performance.now(), time = 0;
  function frame(now) {
    var dt = Math.min(0.05, (now - last) / 1000); last = now; time += dt;
    for (var i = tweens.length - 1; i >= 0; i--) {
      var tw = tweens[i]; tw.t += dt; var k = Math.min(1, tw.t / tw.d); tw.fn(k);
      if (k >= 1) { tweens.splice(i, 1); if (tw.done) tw.done(); }
    }
    if (S.attract && S.shape) {
      S.hq = G.qnorm(G.qmul(G.qmul(G.qaxis(0, 1, 0, dt * 0.16), G.qaxis(1, 0, 0.3, dt * 0.11)), S.hq));
      S.tq = G.qnorm(G.qmul(G.qaxis(0.2, 1, 0, -dt * 0.09), S.tq));
      S.tx = 1.25 + 0.9 * Math.sin(time * 0.13); S.tz = 0.15 * Math.sin(time * 0.21);
      refresh();
    }
    if (S.anim) S.anim(dt);
    else if (S.shape) { var ty = liftTarget(); S.travY += (ty - S.travY) * (1 - Math.exp(-dt * 7)); }
    travGroup.position.set(S.tx, S.travY, S.tz);
    stripeMat.uniforms.uT.value = time;
    var wBefore = S.table ? worldPerPx() : 0;
    updateCamera(dt);
    if (S.table && S.ev && Math.abs(worldPerPx() - wBefore) > wBefore * 1e-3) drawDecals();
    updateDropLines();
    dust.rotation.y = time * 0.01;
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }

  // ---------- start ----------
  resize();
  loadShape('cube'); S.attract = true; refresh();
  $('bBegin').textContent = Object.keys(save.levels).length ? 'Continue' : 'Begin';
  show('title');
  camera.position.set(1.3, 9, 11); updateCamera(1);
  requestAnimationFrame(frame);

  // for tests and the curious
  window.PASSAGE = {
    S: S, G: G, cam: cam, save: save, LV: LV, tightSpot: tightSpot, start: startLevel, refresh: refresh, pass: doPass, hint: hint, setTable: setTable,
    set: function (p) { ['hq', 'tq', 'tx', 'tz', 's'].forEach(function (k) { if (p[k] !== undefined) S[k] = p[k]; }); refresh(); return S.ev; },
    solution: function (id) { return SOL[id || S.shape.id]; },
    screenOf: function (wx, wy, wz) { var v = new THREE.Vector3(wx, wy, wz).project(camera), r = canvas.getBoundingClientRect(); return [(v.x + 1) / 2 * r.width + r.left, (1 - v.y) / 2 * r.height + r.top]; }
  };
})();
</script>
</body>
