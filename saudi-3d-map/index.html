<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saudi Arabia in 3D</title>
<meta name="description" content="An interactive 3D map of Saudi Arabia on real satellite imagery and real terrain.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%230b1622'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%234fd68b'/%3E%3C/svg%3E">
<link rel="stylesheet" href="vendor/maplibre-gl.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="booting">

<canvas id="stars" aria-hidden="true"></canvas>
<div id="map" role="application" aria-label="3D map of Saudi Arabia"></div>
<div id="vignette" aria-hidden="true"></div>

<!-- Opening title card -->
<div id="intro">
  <div class="intro-card">
    <p class="intro-kicker" data-i18n="introKicker"></p>
    <h1 class="intro-title" data-i18n="title"></h1>
    <p class="intro-sub" data-i18n="introSub"></p>
    <div class="intro-bar"><span></span></div>
    <p class="intro-skip" data-i18n="introSkip"></p>
  </div>
</div>

<!-- Top bar -->
<header id="topbar" class="ui">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true"></span>
    <div>
      <div class="brand-title" data-i18n="title"></div>
      <div class="brand-sub" data-i18n="tagline"></div>
    </div>
  </div>
  <div class="top-actions">
    <button id="btn-home" class="btn btn-primary" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/><circle cx="12" cy="12" r="2.2"/></svg>
      <span data-i18n="fullView"></span>
    </button>
    <div class="lang" role="group" aria-label="Language">
      <button id="lang-en" type="button" lang="en">EN</button>
      <button id="lang-ar" type="button" lang="ar">عربي</button>
    </div>
    <button id="btn-credits" class="btn btn-icon" type="button" aria-haspopup="dialog">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6"/><circle cx="12" cy="7.6" r=".6" fill="currentColor"/></svg>
    </button>
  </div>
</header>

<!-- Search, filter and list -->
<aside id="sidebar" class="ui panel">
  <div class="side-head">
    <label class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="search" type="search" autocomplete="off" spellcheck="false">
      <button id="search-clear" type="button" hidden aria-label="Clear">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </label>
    <div id="chips" class="chips" role="group"></div>
  </div>
  <div class="side-count" id="count"></div>
  <ul id="list" class="list"></ul>
  <button id="side-toggle" class="side-toggle" type="button">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 6-6 6 6 6"/></svg>
  </button>
</aside>

<!-- Map controls -->
<div id="controls" class="ui">
  <div id="nav-slot"></div>
  <button id="btn-relief" class="ctl" type="button">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 19 6-11 4 7 2-3 6 7z"/></svg>
    <span id="relief-label"></span>
  </button>
</div>

<!-- Place panel -->
<aside id="detail" class="ui panel" aria-live="polite">
  <button id="detail-close" class="detail-close" type="button">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
  </button>
  <div class="d-scroll">
    <div class="d-photo">
      <button id="photo-open" class="d-photo-main" type="button">
        <span class="d-photo-zoom" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
        </span>
      </button>
      <button id="photo-prev" class="d-photo-nav prev" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 6-6 6 6 6"/></svg></button>
      <button id="photo-next" class="d-photo-nav next" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m10 6 6 6-6 6"/></svg></button>
      <div id="photo-dots" class="d-photo-dots"></div>
    </div>
    <div class="d-caption">
      <div id="photo-caption" class="d-cap-text"></div>
      <div id="photo-credit" class="d-cap-credit"></div>
    </div>
    <div class="d-body">
      <div class="d-badges" id="d-badges"></div>
      <h2 id="d-name"></h2>
      <p id="d-sub" class="d-sub"></p>
      <ul id="d-facts" class="d-facts"></ul>
      <div class="d-meta">
        <span id="d-coords"></span>
        <a id="d-source" target="_blank" rel="noopener"></a>
      </div>
    </div>
  </div>
  <div class="d-foot">
    <button id="place-prev" class="btn" type="button">
      <svg class="flip" viewBox="0 0 24 24" aria-hidden="true"><path d="m14 6-6 6 6 6"/></svg><span data-i18n="prev"></span>
    </button>
    <button id="btn-orbit" class="btn btn-orbit" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path class="i-pause" d="M9 6v12M15 6v12"/><path class="i-play" d="M8 5v14l11-7z"/></svg>
      <span id="orbit-label"></span>
    </button>
    <button id="place-next" class="btn" type="button">
      <span data-i18n="next"></span><svg class="flip" viewBox="0 0 24 24" aria-hidden="true"><path d="m10 6 6 6-6 6"/></svg>
    </button>
  </div>
</aside>

<div id="hint" class="ui" data-i18n="hint"></div>

<footer id="attribution" class="ui"></footer>

<!-- Photo lightbox -->
<div id="lightbox" hidden role="dialog" aria-modal="true">
  <button id="lb-close" class="lb-close" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  <button id="lb-prev" class="lb-nav prev" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 6-6 6 6 6"/></svg></button>
  <figure id="lb-figure">
    <figcaption><span id="lb-caption"></span><span id="lb-credit"></span></figcaption>
  </figure>
  <button id="lb-next" class="lb-nav next" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m10 6 6 6-6 6"/></svg></button>
</div>

<!-- Credits -->
<div id="credits" hidden role="dialog" aria-modal="true">
  <div class="credits-card panel">
    <button id="credits-close" class="detail-close" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    <div id="credits-body" class="credits-body"></div>
  </div>
</div>

<div id="fatal" hidden></div>

<script src="vendor/maplibre-gl.js"></script>
<script src="data/border.js"></script>
<script src="data/places.js"></script>
<script src="js/i18n.js"></script>
<script src="js/app.js"></script>
</body>
</html>
